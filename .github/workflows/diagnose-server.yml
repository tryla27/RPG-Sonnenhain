name: Diagnose game server (read-only)

# Liest Fehlermeldungen und Boss-Meldungen aus dem Log des Spielservers.
# Nur lesen: Nichts auf dem Server wird verändert oder neu gestartet.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    env:
      VSERVER_HOST: ${{ secrets.VSERVER_HOST }}
      VSERVER_USER: ${{ secrets.VSERVER_USER }}
      VSERVER_SSH_KEY: ${{ secrets.VSERVER_SSH_KEY }}
      VSERVER_PORT: ${{ secrets.VSERVER_PORT }}
    steps:
      - name: Read server log summary
        shell: bash
        run: |
          set -euo pipefail
          port="${VSERVER_PORT:-22}"
          umask 077
          install -d -m 700 "$HOME/.ssh"
          trap 'rm -f "$HOME/.ssh/vserver_diag"' EXIT
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ["VSERVER_SSH_KEY"].replace("\r", "").strip()
          key = raw.replace("\\n", "\n") if "BEGIN OPENSSH PRIVATE KEY" in raw else base64.b64decode("".join(raw.split()), validate=True).decode().replace("\r", "").strip()
          Path.home().joinpath(".ssh/vserver_diag").write_text(key + "\n")
          PY
          chmod 600 "$HOME/.ssh/vserver_diag"
          ssh -4 -i "$HOME/.ssh/vserver_diag" -p "$port" -o ConnectTimeout=15 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "$VSERVER_USER@$VSERVER_HOST" 'bash -s' > diag.txt <<'REMOTE'
          set +e
          logs() { journalctl --user -u sonnenhain.service --since "-36h" --no-pager -o cat 2>/dev/null; cat "$HOME/sonnenhain-server/server.log" 2>/dev/null | tail -n 20000; }
          all=$(logs)
          echo "errors=$(printf '%s\n' "$all" | grep -c 'SCRIPT ERROR')"
          echo "out_of_memory=$(printf '%s\n' "$all" | grep -c 'ERR_OUT_OF_MEMORY')"
          echo "boss_spawn=$(printf '%s\n' "$all" | grep -c 'BOSS_SPAWN')"
          echo "boss_stray=$(printf '%s\n' "$all" | grep -c 'BOSS_STRAY')"
          echo "hb_journal=$(journalctl --user -u sonnenhain.service --since '-36h' --no-pager -o cat 2>/dev/null | grep -c SERVER_HEARTBEAT) hb_log=$(grep -c SERVER_HEARTBEAT "$HOME/sonnenhain-server/server.log" 2>/dev/null) log_lines=$(wc -l < "$HOME/sonnenhain-server/server.log" 2>/dev/null)"
          for pid in $(pgrep -f '[s]onnenhain-server.x86_64'); do echo "proc_age=$(ps -o etime= -p $pid | tr -d ' ') bin_age=$(( $(date +%s) - $(stat -c %Y "$HOME/sonnenhain-server/releases/current/sonnenhain-server.x86_64" 2>/dev/null || echo 0) ))s"; done
          echo "procs=$(pgrep -fc '[s]onnenhain-server.x86_64')"
          echo "restarts=$(printf '%s\n' "$all" | grep -c 'restarted\|forcing dedicated')"
          printf '%s\n' "$all" | grep -A1 'SCRIPT ERROR' | grep -v '^--$' | cut -c1-180 | sort | uniq -c | sort -rn | head -12 | sed 's/^/ERR /'
          echo "patch_notice=$(printf '%s\n' "$all" | grep -c 'SERVER_PATCH_NOTICE_SENT')"
          echo "heartbeats=$(printf '%s\n' "$all" | grep -c 'SERVER_HEARTBEAT')"
          printf '%s\n' "$all" | grep 'SERVER_HEARTBEAT' | tail -4 | cut -c1-230 | sed 's/^/HB /'
          printf '%s\n' "$all" | grep 'BOSS_' | tail -5 | cut -c1-160 | sed 's/^/BOSS /'
          printf '%s\n' "$all" | grep 'CLIENT_3D' | tail -4 | cut -c1-400 | sed 's/^/HB /'
          # Laufzeiten (jede Minute): CPU je Serverbild, Weltpakete, Golem. Mit Zeitstempel,
          # damit sich Zeiten vor und nach einer Auslieferung vergleichen lassen.
          echo "PERF_COUNTS journal=$(journalctl --user -u sonnenhain.service --since '-36h' --no-pager -o cat 2>/dev/null | grep -c 'SERVER_PERF') log=$(grep -c 'SERVER_PERF' "$HOME/sonnenhain-server/server.log" 2>/dev/null) logs_dir=$(ls "$HOME/sonnenhain-server" 2>/dev/null | tr '\n' ',' | cut -c1-150)"
          # Die Logdatei hat keine Zeitstempel: Zeilen seit dem letzten Serverstart
          # (Start-/Patchmeldung) gelten als "nachher".
          grep -nE 'SERVER_PERF|GOLEM_PERF|SERVER_HEARTBEAT|SERVER_PATCH_NOTICE_SENT|Godot Engine' "$HOME/sonnenhain-server/server.log" 2>/dev/null | tail -n 4000 | cut -c1-220 | sed 's/^/LOGPERF /'
          echo "NOW_EPOCH $(date +%s)"
          echo "RELEASE_EPOCH $(stat -c %Y "$HOME/sonnenhain-server/releases/current/sonnenhain-server.x86_64" 2>/dev/null || echo 0)"
          journalctl --user -u sonnenhain.service --since "-36h" --no-pager -o short-unix 2>/dev/null | grep -E 'SERVER_PERF|GOLEM_PERF|SERVER_HEARTBEAT' | sed -E 's/^([0-9.]+) [^:]*: /\1 /' | cut -c1-220 | sed 's/^/PERF /'
          uptime -p 2>/dev/null | sed 's/^/UPTIME /'
          pgrep -af "[s]onnenhain-server.x86_64" | sed 's/^/PROC /' | cut -c1-120
          ps -o etime= -p "$(pgrep -f '[s]onnenhain-server.x86_64 --headless' | head -1)" 2>/dev/null | sed 's/^/PROC_AGE /'
          REMOTE
          cat diag.txt >> "$GITHUB_STEP_SUMMARY"
          # Laufzeitzeilen (anonym) auch ins Protokoll, damit sie sich abrufen lassen.
          python3 - <<'PY'
          # Laufzeiten vor/nach der aktuellen Auslieferung zusammenfassen (anonym).
          import re
          release = 0.0
          rows = {"vorher": [], "nachher": []}
          golem = {"vorher": [], "nachher": []}
          peers = {"vorher": [], "nachher": []}
          for line in open("diag.txt", encoding="utf-8", errors="replace"):
              if line.startswith("RELEASE_EPOCH "): release = float(line.split()[1])
              if line.startswith("PERF_COUNTS"): print("::notice title=Serverlast Quellen::" + line.strip())
          for line in open("diag.txt", encoding="utf-8", errors="replace"):
              if not line.startswith("PERF "): continue
              parts = line.split(" ", 2)
              try: stamp = float(parts[1])
              except ValueError: continue
              side = "nachher" if stamp >= release else "vorher"
              text = parts[2]
              values = dict(re.findall(r"(\w+)=([-\d.]+)", text))
              if "SERVER_PERF" in text: rows[side].append(values)
              elif "GOLEM_PERF" in text: golem[side].append(values)
              elif "SERVER_HEARTBEAT" in text and "peers" in values: peers[side].append(int(values["peers"]))
          # Logdatei ohne Zeitstempel: eine SERVER_PERF-Zeile je Minute. Die letzten
          # (jetzt - Auslieferung)/60 Zeilen stammen aus der aktuellen Version.
          now = 0.0
          for line in open("diag.txt", encoding="utf-8", errors="replace"):
              if line.startswith("NOW_EPOCH "): now = float(line.split()[1])
          log_lines = [l for l in open("diag.txt", encoding="utf-8", errors="replace") if l.startswith("LOGPERF ")]
          if not rows["vorher"] and not rows["nachher"] and log_lines:
              perf_total = sum(1 for l in log_lines if "SERVER_PERF" in l)
              after_minutes = int(max(0.0, now - release) / 60.0) if release and now else 0
              seen = 0
              spikes = []
              for l in log_lines:
                  text = l.split(":", 1)[1] if ":" in l else l
                  values = dict(re.findall(r"(\w+)=([-\d.]+)", text))
                  side = "nachher" if perf_total - seen <= after_minutes else "vorher"
                  if "SERVER_PERF" in text:
                      seen += 1
                      rows[side].append(values)
                      peak = float(values.get("cpu_max", 0))
                      if peak > 50: spikes.append("vor %d min: %.0f ms" % (perf_total - seen, peak))
                  elif "GOLEM_PERF" in text: golem[side].append(values)
                  elif "SERVER_HEARTBEAT" in text and "peers" in values: peers[side].append(int(values["peers"]))
              print("::notice title=Serverlast Spitzen::Auslieferung vor %d min; Spitzen über 50 ms: %s" % (after_minutes, "; ".join(spikes[-12:]) or "keine"))
          def pct(values, part):
              values = sorted(values)
              return values[min(len(values) - 1, max(0, int(len(values) * part + .999) - 1))] if values else 0
          for side in ("vorher", "nachher"):
              r = rows[side]
              cpu = [float(v.get("cpu_avg", 0)) for v in r]; peak = [float(v.get("cpu_max", 0)) for v in r]
              enc = [float(v.get("encode_avg", 0)) for v in r]; kib = [float(v.get("world_kib_s", 0)) for v in r]
              deferred = sum(int(float(v.get("deferred", 0))) for v in r)
              busy = [p for p in peers[side] if p > 0]
              line = "%s: Minuten=%d mit_Spielern=%d max_Spieler=%d cpu_avg_mittel=%.2fms spitze_p95=%.1fms spitze_max=%.1fms ueber50ms=%d kodieren=%.2fms welt=%.1fKiB/s zurueckgestellt=%d" % (
                  side, len(r), len(busy), max(peers[side] or [0]), sum(cpu) / max(1, len(cpu)), pct(peak, .95), max(peak or [0]), sum(1 for p in peak if p > 50), sum(enc) / max(1, len(enc)), sum(kib) / max(1, len(kib)), deferred)
              g = golem[side]
              if g: line += " golem_minuten=%d golem_max=%sms" % (len(g), max(float(v.get("max", 0)) for v in g))
              print("::notice title=Serverlast %s::%s" % (side, line))
          PY
          while IFS= read -r line; do
            safe=$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')
            echo "::notice title=Server-Diagnose::$safe"
          done < <(grep -E "^(HB|BOSS) " diag.txt | tail -6; grep -vE "^(HB|BOSS|ERR|PROC|UPTIME) " diag.txt | head -6)
