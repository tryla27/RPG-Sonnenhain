name: Build and deploy Sonnenhain website

on:
  push:
    branches: [main]
    paths:
      - "**/*.gd"
      - "**/*.tscn"
      - "project.godot"
      - "export_presets.cfg"
      - "art/**"
      - "audio/**"
      - "music/**"
      - "tools/harden_web.py"
      - "web-legal/**"
      - "website/**"
      - "CNAME"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonnenhain-site-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.3 and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 8 --retry-all-errors -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64

          curl -fL --retry 8 --retry-all-errors -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -R /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Export web game
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/site
          mkdir -p build/site/game
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --export-release "Web" build/site/game/index.html

      - name: Export dedicated Linux server
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/server
          mkdir -p build/server
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --export-release "Linux Server" build/server/sonnenhain-server.x86_64
          chmod +x build/server/sonnenhain-server.x86_64
          test -x build/server/sonnenhain-server.x86_64

      - name: Smoke-test dedicated server
        shell: bash
        run: |
          set -euo pipefail
          build/server/sonnenhain-server.x86_64 --headless -- --dedicated-server > /tmp/sonnenhain-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 4
          if ! kill -0 "$server_pid" 2>/dev/null; then
            cat /tmp/sonnenhain-server.log
            exit 1
          fi
          if ! ss -ltn | grep -q ':27845 '; then
            cat /tmp/sonnenhain-server.log
            echo "Dedicated server process is alive but port 27845 is not listening."
            exit 1
          fi
          kill "$server_pid"
          wait "$server_pid" 2>/dev/null || true
          trap - EXIT
          cat /tmp/sonnenhain-server.log

      - name: Harden browser game shell
        run: python3 tools/harden_web.py build/site/game/index.html

      - name: Assemble website
        shell: bash
        run: |
          set -euo pipefail
          cp website/index.html build/site/index.html
          cp website/site.css build/site/site.css
          cp CNAME build/site/CNAME
          cp web-legal/datenschutz.html build/site/datenschutz.html
          cp web-legal/impressum.html build/site/impressum.html
          cp web-legal/sicherheit.html build/site/sicherheit.html
          cp web-legal/robots.txt build/site/robots.txt
          mkdir -p build/site/.well-known
          cp web-legal/security.txt build/site/.well-known/security.txt
          touch build/site/.nojekyll

          test -f build/site/index.html
          test -f build/site/site.css
          test -f build/site/game/index.html
          test -f build/site/game/index.pck
          test -f build/site/game/index.wasm
          grep -q "Eine Reise durch" build/site/index.html
          grep -q "human-gate" build/site/game/index.html

      - name: Deploy to Manitu webspace
        if: ${{ env.MANITU_SSH_KEY != '' }}
        env:
          MANITU_SSH_KEY: ${{ secrets.MANITU_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          trap 'rm -f "$HOME/.ssh/manitu_deploy" "$HOME/.ssh/manitu_deploy.pub"' EXIT
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          raw = os.environ["MANITU_SSH_KEY"].replace("\r", "").strip()
          if "BEGIN OPENSSH PRIVATE KEY" in raw:
              key = raw.replace("\\n", "\n")
          else:
              try:
                  decoded = base64.b64decode("".join(raw.split()), validate=True)
                  key = decoded.decode("utf-8").replace("\r", "").strip()
              except Exception as exc:
                  raise SystemExit("MANITU_SSH_KEY is neither a valid OpenSSH private key nor valid Base64: %s" % exc)

          if "BEGIN OPENSSH PRIVATE KEY" not in key or "END OPENSSH PRIVATE KEY" not in key:
              raise SystemExit("Decoded MANITU_SSH_KEY does not contain a complete OpenSSH private key")

          Path.home().joinpath(".ssh/manitu_deploy").write_text(key.strip() + "\n", encoding="utf-8")
          PY
          chmod 600 "$HOME/.ssh/manitu_deploy"
          ssh-keygen -y -f "$HOME/.ssh/manitu_deploy" > "$HOME/.ssh/manitu_deploy.pub"
          echo "Deploy key fingerprint:"
          ssh-keygen -lf "$HOME/.ssh/manitu_deploy.pub"
          echo "Deploy public key (safe to copy to Manitu):"
          cat "$HOME/.ssh/manitu_deploy.pub"

          ssh -4 -i "$HOME/.ssh/manitu_deploy" -p 22 \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 \
            ssh300011111@ngcobalt378.manitu.net \
            'echo "SSH OK"; id; uname -a; printf "systemctl="; command -v systemctl || true; printf "nohup="; command -v nohup || true; printf "python3="; command -v python3 || true'

          timeout 180s rsync -az --delete --omit-dir-times --no-perms --no-owner --no-group --exclude='sshusers/' \
            -e "ssh -4 -i $HOME/.ssh/manitu_deploy -p 22 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12" \
            build/site/ \
            ssh300011111@ngcobalt378.manitu.net:/home/sites/site100047525/web/

      - name: Manitu deploy not configured
        if: ${{ env.MANITU_SSH_KEY == '' }}
        env:
          MANITU_SSH_KEY: ${{ secrets.MANITU_SSH_KEY }}
        run: echo "MANITU_SSH_KEY is not configured yet; build completed without server deployment."
