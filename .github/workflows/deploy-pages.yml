name: Build and deploy Sonnenhain Web

on:
  push:
    branches: [main]
    paths:
      - "**/*.gd"
      - "**/*.tscn"
      - "project.godot"
      - "export_presets.cfg"
      - "art/**"
      - "audio/**"
      - "music/**"
      - "tools/harden_web.py"
      - "web-legal/**"
      - "website/**"
      - "CNAME"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.3 and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 8 --retry-all-errors -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64

          curl -fL --retry 8 --retry-all-errors -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -R /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Export web build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/site/game
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --export-release "Web" build/site/game/index.html

      - name: Harden browser shell
        run: python3 tools/harden_web.py build/site/game/index.html

      - name: Assemble website
        shell: bash
        run: |
          set -euo pipefail
          cp website/index.html build/site/index.html
          cp website/site.css build/site/site.css
          cp CNAME build/site/CNAME
          cp web-legal/datenschutz.html build/site/datenschutz.html
          cp web-legal/impressum.html build/site/impressum.html
          cp web-legal/sicherheit.html build/site/sicherheit.html
          cp web-legal/robots.txt build/site/robots.txt
          mkdir -p build/site/.well-known
          cp web-legal/security.txt build/site/.well-known/security.txt
          touch build/site/.nojekyll
          test -f build/site/index.html
          test -f build/site/game/index.html
          test -f build/site/game/index.pck
          test -f build/site/game/index.wasm

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
