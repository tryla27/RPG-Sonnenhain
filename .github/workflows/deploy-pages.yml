name: Build and deploy Sonnenhain website

on:
  push:
    branches: [main]
    paths:
      - "**/*.gd"
      - "**/*.tscn"
      - "project.godot"
      - "export_presets.cfg"
      - "art/**"
      - "audio/**"
      - "music/**"
      - "tools/harden_web.py"
      - "web-legal/**"
      - "website/**"
      - "CNAME"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sonnenhain-site-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.3 and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 8 --retry-all-errors -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64

          curl -fL --retry 8 --retry-all-errors -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -R /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Export web game
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/site
          mkdir -p build/site/game
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --export-release "Web" build/site/game/index.html

      - name: Harden browser game shell
        run: python3 tools/harden_web.py build/site/game/index.html

      - name: Assemble website
        shell: bash
        run: |
          set -euo pipefail
          cp website/index.html build/site/index.html
          cp website/site.css build/site/site.css
          cp CNAME build/site/CNAME
          cp web-legal/datenschutz.html build/site/datenschutz.html
          cp web-legal/impressum.html build/site/impressum.html
          cp web-legal/sicherheit.html build/site/sicherheit.html
          cp web-legal/robots.txt build/site/robots.txt
          mkdir -p build/site/.well-known
          cp web-legal/security.txt build/site/.well-known/security.txt
          touch build/site/.nojekyll

          test -f build/site/index.html
          test -f build/site/site.css
          test -f build/site/game/index.html
          test -f build/site/game/index.pck
          test -f build/site/game/index.wasm
          grep -q "Eine Reise durch" build/site/index.html
          grep -q "human-gate" build/site/game/index.html

      - name: Publish generated site to docs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          rsync -a --delete build/site/ docs/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs

          if ! git diff --cached --quiet; then
            git commit -m "Publish generated Sonnenhain website"
            git push origin HEAD:main
          else
            echo "docs is already up to date"
          fi

      - name: Deploy to Manitu webspace
        if: ${{ env.MANITU_SSH_KEY != '' }}
        env:
          MANITU_SSH_KEY: ${{ secrets.MANITU_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$MANITU_SSH_KEY" > "$HOME/.ssh/manitu_deploy"
          chmod 600 "$HOME/.ssh/manitu_deploy"

          ssh-keyscan -p 22 ngcobalt378.manitu.net >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh -i "$HOME/.ssh/manitu_deploy" -p 22 \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 \
            ssh300011111@ngcobalt378.manitu.net \
            'echo "SSH OK"; id; uname -a; printf "systemctl="; command -v systemctl || true; printf "nohup="; command -v nohup || true; printf "python3="; command -v python3 || true'

          timeout 180s rsync -az --delete \
            -e "ssh -i $HOME/.ssh/manitu_deploy -p 22 -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12" \
            build/site/ \
            ssh300011111@ngcobalt378.manitu.net:/home/sites/site100047525/web/

          rm -f "$HOME/.ssh/manitu_deploy"

      - name: Manitu deploy not configured
        if: ${{ env.MANITU_SSH_KEY == '' }}
        env:
          MANITU_SSH_KEY: ${{ secrets.MANITU_SSH_KEY }}
        run: echo "MANITU_SSH_KEY is not configured yet; build completed without server deployment."
