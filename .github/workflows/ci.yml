name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonnenhain-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_BIN: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64

jobs:
  test-and-build:
    name: Tests and exports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Godot cache
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/godot
            /tmp/templates
            ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-${{ env.GODOT_VERSION }}-${{ runner.os }}

      - name: Install Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 8 --retry-all-errors \
            -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "$GODOT_BIN"
          curl -fL --retry 8 --retry-all-errors \
            -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -R /tmp/templates/templates/* \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Require patch notes update
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed="$(git diff --name-only "origin/${{ github.base_ref }}" HEAD)"
          echo "$changed"
          if echo "$changed" | grep -Eq '^(main\.gd|components/|art/|website/|project\.godot|export_presets\.cfg)' &&
             ! echo "$changed" | grep -qx 'components/patch_notes.gd'; then
            echo "::error::Relevant patch changed runtime/game content without updating components/patch_notes.gd"
            exit 1
          fi

      - name: Validate content
        run: python3 tools/check_content.py

      - name: Check password-only website access
        run: |
          php -l website/access/access.php
          python3 tools/check_website_access.py
          node tools/check_browser_bridge.cjs

      - name: Import project and validate GDScript
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --editor --import --quit

      - name: Focused multiplayer diagnostics
        shell: bash
        run: |
          set -euo pipefail
          for script in check_region_spawn_matrix check_spawn_network check_combat_feedback_network check_mob_combat_network check_party_xp_network; do
            echo "::group::$script"
            timeout 120 "$GODOT_BIN" --headless --path . --script "tools/$script.gd"
            echo "::endgroup::"
          done

      - name: Village navigation and spell fusion catalog
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 "$GODOT_BIN" --headless --path . --script tools/check_village_fusion_upgrade.gd
          timeout 120 "$GODOT_BIN" --headless --path . --script tests/fusion/check_fusion_identity.gd
          timeout 120 "$GODOT_BIN" --headless --path . --script tests/fusion/check_fusion_impact_rules.gd
          timeout 120 "$GODOT_BIN" --headless --path . --script tools/check_map_logic.gd
          timeout 120 "$GODOT_BIN" --headless --path . --script tools/check_map0_transitions.gd

      - name: Inspect live server release
        env:
          VSERVER_HOST: ${{ secrets.VSERVER_HOST }}
          VSERVER_USER: ${{ secrets.VSERVER_USER }}
          VSERVER_SSH_KEY: ${{ secrets.VSERVER_SSH_KEY }}
          VSERVER_PORT: ${{ secrets.VSERVER_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VSERVER_HOST:-}" ] || [ -z "${VSERVER_USER:-}" ] || [ -z "${VSERVER_SSH_KEY:-}" ]; then
            echo "LIVE_SERVER_DIAG_SKIPPED missing VServer secret"
            exit 0
          fi
          port="${VSERVER_PORT:-22}"
          umask 077
          install -d -m 700 "$HOME/.ssh"
          trap 'rm -f "$HOME/.ssh/live_diag"' EXIT
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          raw=os.environ["VSERVER_SSH_KEY"].replace("\r","").strip()
          key=raw.replace("\\n","\n") if "BEGIN OPENSSH PRIVATE KEY" in raw else base64.b64decode("".join(raw.split()),validate=True).decode().strip()
          Path.home().joinpath(".ssh/live_diag").write_text(key+"\n")
          PY
          chmod 600 "$HOME/.ssh/live_diag"
          ssh_opts="-4 -i $HOME/.ssh/live_diag -p $port -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          ssh $ssh_opts "$VSERVER_USER@$VSERVER_HOST" 'echo "LIVE_BUILD_COMMIT=$(cat "$HOME/sonnenhain-server/releases/current/BUILD_COMMIT.txt" 2>/dev/null || echo missing)"; pgrep -af "sonnenhain-server.x86_64.*dedicated-server" || true'

      - name: Run gameplay regression tests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r test_script; do
            echo "::group::${test_script}"
            timeout 120 "$GODOT_BIN" --headless --path . --script "$test_script" 2>&1 | tee /tmp/sonnenhain-ci-test.log
            if grep -q "SCRIPT ERROR:" /tmp/sonnenhain-ci-test.log; then exit 1; fi
            echo "::endgroup::"
          done < <(
            {
              find tools -maxdepth 1 -name 'check_*.gd' \
                ! -name 'check_party_xp_network.gd' \
                ! -name 'check_boss_head_save_network.gd' \
                ! -name 'check_server_save_network.gd'
              find tests -type f -name 'check_*.gd'
            } | sort
          )
          timeout 120 "$GODOT_BIN" --headless --path . --script tools/check_party_xp_network.gd

      - name: Export web and dedicated server
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/ci
          mkdir -p build/ci/web build/ci/server
          "$GODOT_BIN" --headless --path . --export-release Web build/ci/web/index.html
          "$GODOT_BIN" --headless --path . --export-release "Linux Server" \
            build/ci/server/sonnenhain-server.x86_64
          test -f build/ci/web/index.html
          test -f build/ci/web/index.pck
          test -f build/ci/web/index.wasm
          test -x build/ci/server/sonnenhain-server.x86_64
          test -f build/ci/server/sonnenhain-server.pck

      - name: Run dedicated server smoke test
        shell: bash
        run: |
          set -euo pipefail
          build/ci/server/sonnenhain-server.x86_64 --headless -- \
            --dedicated-server > /tmp/sonnenhain-ci-server.log 2>&1 &
          server_pid=$!
          save_dir="$(mktemp -d /tmp/sonnenhain-ci-save.XXXXXX)"
          build/ci/server/sonnenhain-server.x86_64 --headless -- \
            --dedicated-server --server-port=31876 --save-dir="$save_dir" \
            > /tmp/sonnenhain-ci-save-server.log 2>&1 &
          save_server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            kill "$save_server_pid" 2>/dev/null || true
            wait "$save_server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in {1..20}; do
            if ss -ltn | grep -q ':27845 ' && ss -ltn | grep -q ':31876 '; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null || ! kill -0 "$save_server_pid" 2>/dev/null; then
              cat /tmp/sonnenhain-ci-server.log
              cat /tmp/sonnenhain-ci-save-server.log
              exit 1
            fi
            sleep 1
          done
          ss -ltn | grep -q ':27845 '
          ss -ltn | grep -q ':31876 '
          "$GODOT_BIN" --headless --path . --script tools/check_server_save_network.gd \
            -- --save-test-url=ws://127.0.0.1:31876
          "$GODOT_BIN" --headless --path . --script tools/check_boss_head_save_network.gd \
            -- --save-test-url=ws://127.0.0.1:31876

      - name: Upload CI builds
        uses: actions/upload-artifact@v4
        with:
          name: sonnenhain-ci-builds
          path: build/ci
          if-no-files-found: error
          retention-days: 14
