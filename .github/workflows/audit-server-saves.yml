name: Audit server saves (read-only)

# Prüft die Spielstände auf dem Spielserver auf Vermischung durch Charakterwechsel
# (Fehler A1). Nur lesen: Nichts auf dem Server wird verändert oder neu gestartet.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    env:
      VSERVER_HOST: ${{ secrets.VSERVER_HOST }}
      VSERVER_USER: ${{ secrets.VSERVER_USER }}
      VSERVER_SSH_KEY: ${{ secrets.VSERVER_SSH_KEY }}
      VSERVER_PORT: ${{ secrets.VSERVER_PORT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 8 --retry-all-errors -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64

      - name: Export audit rules
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import >/dev/null 2>&1 || true
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tools/save_audit_spec.gd -- /tmp/save_audit_spec.json
          test -s /tmp/save_audit_spec.json

      - name: Run audit on the game server
        shell: bash
        run: |
          set -euo pipefail
          port="${VSERVER_PORT:-22}"
          umask 077
          install -d -m 700 "$HOME/.ssh"
          trap 'rm -f "$HOME/.ssh/vserver_audit"' EXIT
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ["VSERVER_SSH_KEY"].replace("\r", "").strip()
          key = raw.replace("\\n", "\n") if "BEGIN OPENSSH PRIVATE KEY" in raw else base64.b64decode("".join(raw.split()), validate=True).decode().replace("\r", "").strip()
          Path.home().joinpath(".ssh/vserver_audit").write_text(key + "\n")
          PY
          chmod 600 "$HOME/.ssh/vserver_audit"
          spec=$(base64 -w0 /tmp/save_audit_spec.json)
          ssh -4 -i "$HOME/.ssh/vserver_audit" -p "$port" -o ConnectTimeout=15 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "$VSERVER_USER@$VSERVER_HOST" "python3 - \"\$HOME/sonnenhain-server/data/player-saves\" $spec" \
            < tools/audit_server_saves.py > save-audit.md
          # Öffentliche Zusammenfassung nur mit Zahlen; Namen stehen nur im Bericht-Artefakt.
          head -3 save-audit.md >> "$GITHUB_STEP_SUMMARY"
          # Zahlen als Hinweis am Lauf (ohne Namen), damit sie per API lesbar sind.
          echo "::notice title=Spielstand-Prüfung::$(sed -n 3p save-audit.md)"

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: save-audit
          path: save-audit.md
          retention-days: 7
