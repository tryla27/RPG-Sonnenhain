name: Build and deploy Sonnenhain game server

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.gd"
      - "**/*.tscn"
      - "project.godot"
      - "export_presets.cfg"
      - "server/**"
      - ".github/workflows/deploy-server.yml"

permissions:
  contents: read

concurrency:
  group: sonnenhain-game-server
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.3"
      VSERVER_HOST: ${{ secrets.VSERVER_HOST }}
      VSERVER_USER: ${{ secrets.VSERVER_USER }}
      VSERVER_SSH_KEY: ${{ secrets.VSERVER_SSH_KEY }}
      VSERVER_PORT: ${{ secrets.VSERVER_PORT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot and templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 8 --retry-all-errors -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          curl -fL --retry 8 --retry-all-errors -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -R /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Export dedicated server
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/server
          mkdir -p build/server
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --export-release "Linux Server" build/server/sonnenhain-server.x86_64
          chmod +x build/server/sonnenhain-server.x86_64
          test -x build/server/sonnenhain-server.x86_64

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout 5s build/server/sonnenhain-server.x86_64 --headless -- --dedicated-server > /tmp/server.log 2>&1
          code=$?
          set -e
          cat /tmp/server.log
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi
          grep -q "Dedicated WebSocket Server aktiv" /tmp/server.log

      - name: Upload server build
        uses: actions/upload-artifact@v4
        with:
          name: sonnenhain-linux-server
          path: |
            build/server/sonnenhain-server.x86_64
            build/server/sonnenhain-server.pck
          if-no-files-found: error
          retention-days: 14

      - name: Deploy to VServer
        if: ${{ env.VSERVER_HOST != '' && env.VSERVER_USER != '' && env.VSERVER_SSH_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          port="${VSERVER_PORT:-22}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VSERVER_SSH_KEY" > "$HOME/.ssh/vserver_deploy"
          chmod 600 "$HOME/.ssh/vserver_deploy"

          ssh_opts="-4 -i $HOME/.ssh/vserver_deploy -p $port -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"

          ssh $ssh_opts "$VSERVER_USER@$VSERVER_HOST" 'mkdir -p ~/sonnenhain-server/releases ~/sonnenhain-server/data'
          rsync -az -e "ssh $ssh_opts" build/server/ "$VSERVER_USER@$VSERVER_HOST:~/sonnenhain-server/releases/current/"

          ssh $ssh_opts "$VSERVER_USER@$VSERVER_HOST" '
            set -eu
            cd ~/sonnenhain-server/releases/current
            chmod +x sonnenhain-server.x86_64
            if command -v systemctl >/dev/null 2>&1 && systemctl --user status >/dev/null 2>&1; then
              mkdir -p ~/.config/systemd/user
              cat > ~/.config/systemd/user/sonnenhain.service <<EOF
[Unit]
Description=Sonnenhain dedicated server
After=network-online.target
[Service]
Type=simple
WorkingDirectory=%h/sonnenhain-server/releases/current
ExecStart=%h/sonnenhain-server/releases/current/sonnenhain-server.x86_64 --headless -- --dedicated-server
Restart=always
RestartSec=3
[Install]
WantedBy=default.target
EOF
              systemctl --user daemon-reload
              systemctl --user enable --now sonnenhain.service
              systemctl --user restart sonnenhain.service
            else
              pkill -f "sonnenhain-server.x86_64 --headless -- --dedicated-server" || true
              nohup ./sonnenhain-server.x86_64 --headless -- --dedicated-server > ~/sonnenhain-server/server.log 2>&1 </dev/null &
            fi
          '

          rm -f "$HOME/.ssh/vserver_deploy"

      - name: VServer deploy not configured
        if: ${{ env.VSERVER_HOST == '' || env.VSERVER_USER == '' || env.VSERVER_SSH_KEY == '' }}
        run: echo "Server build is ready; VSERVER_HOST, VSERVER_USER and VSERVER_SSH_KEY are still required for live deployment."
