name: Package Godot source

on:
  push:
    branches:
      - fix/alma-ws-navigation

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify latest source
        shell: bash
        run: |
          set -euo pipefail
          test -f project.godot
          git rev-parse HEAD > SOURCE_COMMIT.txt
          printf 'Godot project source from main\n' > GODOT_IMPORT_README.txt
          printf 'Open/import project.godot in Godot 4.7.2 or newer.\n' >> GODOT_IMPORT_README.txt
          printf 'Source commit: ' >> GODOT_IMPORT_README.txt
          cat SOURCE_COMMIT.txt >> GODOT_IMPORT_README.txt

      - name: Create Godot project zip
        shell: bash
        run: |
          set -euo pipefail
          zip -r Sonnenhain-Godot-latest.zip . \
            -x '.git/*' \
               '.github/workflows/package-godot-source.yml' \
               'Sonnenhain-Godot-latest.zip'
          unzip -l Sonnenhain-Godot-latest.zip | grep -q ' project.godot$'

      - name: Upload Godot project
        uses: actions/upload-artifact@v4
        with:
          name: sonnenhain-godot-source
          path: Sonnenhain-Godot-latest.zip
          if-no-files-found: error
          retention-days: 7
